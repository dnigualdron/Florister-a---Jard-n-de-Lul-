<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="floristeria.css">
  <title>floristeria</title>
</head>

<body>
  
  <div class="contenedor1">
    <div>
      <div class="barra_ini">
            <div class="nav">
                <h1>Jardín de Lulú</h1>
                <div>
                    <img src="./fotos/Logo.png" alt="">
                </div>
            </div>
            <div class="nav1">
                <div class="nav2">
                    <button>Catálogo</button>
                </div>
                <div class="nav2">
                    <button class="activo">Colecciones</button>
                </div>
                <div class="nav2">
                    <button>Nuestro Taller</button>
                </div>
                <div class="nav2">
                    <button>Cuidado de Flores</button>
                </div>
                <div class="nav2">
                    <button>Contactos</button>
                </div>
                <div class="nav2">
                    <button>Testimonios</button>
                </div>
            </div>
            <div class="iconos_ini">
                <button>🛒</button>
                <button>🔍</button>
                <button>☰</button>
            </div>
        </div>
    </div>
    <div>
      <div class="titu"> Eventos matrimoniales
      </div>
      <p class="boda">En nuestra floristeria transformamos espacios espacios en momentos inolvidables. Completa el
        formulario para agendar una asesoría perzonalizada. <br> ¡Construyamos juntos la ambientación perfecta para tu
        gran día!</p>
    </div>
    <div class="servicios">
      <div class="formu">Formulario</div>
      <label class="nombre">Nombre completo</label>

      <div class="field-body">
        <div class="field">
          <div class="control">
            <input class="input is small" type="text" id="Nombre">
          </div>
        </div>
      </div>

      <div class="field is-horizontal">
        <div class="field-label is-normal">
          <label class="contactos"> Telefono/WhatsApp</label>
        </div>
        <div class="field-body">
          <div class="field">
            <div class="control">
              <input class="input" type="number" id="numero">
            </div>
          </div>
        </div>
      </div>

      <div class="field is-horizontal">
        <div class="field-label is-normal">
          <label class="documento"> Documento de identidad</label>
        </div>
        <div class="field-body">
          <div class="field">
            <div class="control">
              <input class="input" type="number" id="numero" placeholder="C.C">
            </div>
          </div>
        </div>
      </div>
      <div class="field is-horizontal">
        <div class="fiel-label is-normal">
          <label class="correo">Gmail</label>
        </div>
        <div class="field-body">
          <div class="field">
            <div class="control">
              <input class="input" type="email" id="correo" placeholder="@correo.com" required>
            </div>
          </div>
        </div>
      </div>
      <div class="field is-horizontal">
        <div class="field-label is-medium">
          <label class="invitados">Numero de invitados</label>
        </div>
        <div class="field-body">
          <div class="field">
            <div class="control">
              <input class="input is-medium" type="text">
            </div>
          </div>
        </div>
      </div>

      <div class="field is-horizontal">
        <div class="field-label is-normal">
          <label class="casa">Recidencia</label>
        </div>
        <div class="field-body">
          <div class="field">
            <div class="control">
              <input class="input" type="text">
            </div>
          </div>
        </div>

        <div class="field is-horizontal">
          <div class="field-label is-large">
            <label class="lugarm">Locación</label>
          </div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input class="input is-large" type="text">
              </div>
            </div>
          </div>
          <div class="field is-horizontal">
            <div class="field-label is-normal">
              <label class="surge">Sugerencias</label>
            </div>
            <div class="field-body">
              <div class="field">
                <div class="control">
                  <input class="input" type="text">
                </div>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>
</body>

</html>
