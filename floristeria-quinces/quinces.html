<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="quinces.css">
    <title>eventos quinces</title>
</head>

<body>
    <div class="contenedor">
        <div class="titulo">Quince Primaveras</div>
        <p class="años">Gran momento y emotiva celebracion de quince años donde se reuinieron familiares y amigos conmemorando ese dia especial. En la celebración destaco mucho las decoraciones.</p>
        </div>
        <div class="servicios">
        <div class="formu">Formulario</div>

        <label class="nombre">Nombre completo</label>
        <div class=" field-body">
            <div class="field">
                <div class="control">
                    <input class="input is small" type="text" id="Nombre">
                </div>
            </div>
        </div>

    <div class="field is-horizontal">
        <div class="fiel-label is-normal">
            <label class="contactos">Telefono/WhatsApp</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <input class="input" type="number" id="numero">
                </div>
            </div>
        </div>
        </div>

        <div class="field is-horizontal">
        <div class="fiel-label is-normal">
            <label class="documento">Documento de identidad</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <input class="input" type="text">
                </div>
            </div>
        </div>
        </div>

        <div class="field is-horizontal">
        <div class="fiel-label is-normal">
            <label class="correo">Gmail</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <input class="input" type="email" id="correo" placeholder="@correo.com" required>
                </div>
            </div>
        </div>
        </div>

    <div class="field is-horizontal">
        <div class="fiel-label is-normal">
            <label class="invitados">Cantidad de invitados</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <input class="input" type="number">
                </div>
            </div>
        </div>
        </div>
        
        <div class="field is-horizontal">
        <div class="fiel-label is-normal">
            <label class="casa">Recidencia</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <input class="input" type="text">
                </div>
            </div>
        </div>
        </div>

        <div class="field is-horizontal">
        <div class="fiel-label is-normal">
            <label class="lugarm">Lugar o locación</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <input class="input" type="text">
                </div>
            </div>
        </div>
        </div>

        <div class="field is-horizontal">
        <div class="fiel-label is-normal">
            <label class="surge">Sugerencias</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <input class="input" type="text" placeholder="flores decorativas">
                </div>
            </div>
        </div>
        </div>

        
    
    </div>
</body>
</html>
